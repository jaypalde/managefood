[build]
  command = "npm install && npx prisma generate && npx prisma migrate deploy"
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/distributor/*"
  to = "/distributor/:splat"
  status = 200

[[redirects]]
  from = "/stall/*"
  to = "/stall/:splat"
  status = 200

[[redirects]]
  from = "/pilgrim/*"
  to = "/pilgrim/:splat"
  status = 200
