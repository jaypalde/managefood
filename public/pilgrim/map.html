<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find Free Food — KumbhSetu</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="topbar">
  <h1>🙏 KumbhSetu — Free Food Near You</h1>
  <a href="/" style="color:white; font-weight:600; text-decoration:none;">Stall/Distributor/Admin Login →</a>
</div>
<div class="container">
  <div class="card">
    <p style="margin:0; color:var(--muted);">These are active free-food distribution points where surplus food from stalls is being shared with pilgrims. No login required.</p>
  </div>
  <div class="card">
    <div id="map" style="height: 420px; border-radius: 10px;"></div>
  </div>
  <div class="card">
    <h3>Distribution Points</h3>
    <div id="pointsList"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
async function loadPoints() {
  const { points } = await api('/pilgrim-points');
  const listEl = document.getElementById('pointsList');
  if (points.length === 0) {
    listEl.innerHTML = '<p>No active distribution points right now. Please check back shortly.</p>';
  } else {
    listEl.innerHTML = points.map((p) => `
      <div class="card" style="padding:12px 16px;">
        <b>${p.name}</b> ${p.zone ? `<span class="badge gray">${p.zone}</span>` : ''}
        <div style="font-size:0.85rem; color:var(--muted); margin-top:4px;">
          ${p.lastDistributionAt ? 'Last served: ' + fmtDate(p.lastDistributionAt) : 'No distribution recorded yet'}
        </div>
        <a href="https://www.google.com/maps/search/?api=1&query=${p.latitude},${p.longitude}" target="_blank" rel="noopener">Get Directions →</a>
      </div>`).join('');
  }

  if (points.length > 0) {
    const map = L.map('map').setView([points[0].latitude, points[0].longitude], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
    points.forEach((p) => L.marker([p.latitude, p.longitude]).addTo(map).bindPopup(`<b>${p.name}</b>`));
  } else {
    document.getElementById('map').innerHTML = '<p style="padding:20px;">Map will appear once distribution points are active.</p>';
  }
}
loadPoints();
</script>
</body>
</html>
